[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchat"
version = "1.2.0.dev18"
description = "Agent-to-agent messaging bus: HTTP API + SSE + MCP. One server, many agents, one source of truth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Wayne Comerford", email = "wayne@comerdord.dev" }
]
keywords = ["mcp", "agents", "ai", "llm", "messaging", "sse", "stdio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]
dependencies = []  # stdlib only at runtime

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "requests>=2.31",
  "openapi-spec-validator>=0.7",
]
s3 = [
  "boto3>=1.34",  # swap-in object storage backend for files store
]
postgres = [
  "psycopg[binary]>=3.1",  # swap-in backend when AGENTCHAT_DB_URL is set
]
telegram = [
  # Optional Telegram bot bridge. Single dep, async-first, well maintained.
  "python-telegram-bot>=21,<22",
]

[project.scripts]
agentchat = "agentchat.__main__:main"
agentchat-bot = "agentchat.bot.app:main"

[project.urls]
Homepage = "https://github.com/wayne-comerford/agentchat"
Repository = "https://github.com/wayne-comerford/agentchat.git"
Issues = "https://github.com/wayne-comerford/agentchat/issues"
Changelog = "https://github.com/wayne-comerford/agentchat/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentchat*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
agentchat = ["web/*", "web/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
