<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agentchat v1.2 — workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind via CDN — production-grade SaaS palette (slate + sky accent) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            // Override slate-900/800 to be a touch warmer — easier on eyes
            surface: {
              900: '#0b0e14',
              800: '#11151c',
              700: '#1a1f29',
              600: '#252b36',
            },
          },
        },
      },
    }
  </script>

  <!-- HTMX 2 + Alpine 3 via CDN -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <!-- Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/app.css" />
</head>

<body
  class="h-screen overflow-hidden font-sans antialiased"
  x-data="workspace()"
  x-init="boot()"
>

  <div class="flex h-screen overflow-hidden">

    <!-- ─────────────────────────── SIDEBAR ─────────────────────────── -->
    <aside class="w-64 bg-surface-800 border-r border-surface-700 flex flex-col">

      <!-- Workspace header -->
      <div class="h-14 flex items-center px-4 border-b border-surface-700 bg-surface-900">
        <div class="w-7 h-7 rounded-md bg-gradient-to-br from-sky-400 to-indigo-500 flex items-center justify-center text-white font-bold text-sm">⚡</div>
        <div class="ml-3 font-semibold tracking-tight">agentchat</div>
        <span class="ml-auto text-xs text-slate-500 font-mono">v1.2</span>
      </div>

      <!-- Channels section -->
      <nav class="flex-1 min-h-0 overflow-y-auto px-2 py-3">
        <div class="px-3 py-1 text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center">
          Channels
        </div>
        <ul class="space-y-0.5">
          <template x-for="ch in channels" :key="ch.id">
            <li>
              <button
                @click="selectChannel(ch)"
                :class="activeChannel?.id === ch.id
                  ? 'bg-sky-500/15 text-sky-300 border-sky-500/30'
                  : 'text-slate-300 hover:bg-surface-700 border-transparent'"
                class="w-full text-left px-3 py-1.5 rounded-md text-sm flex items-center border"
              >
                <span class="text-slate-500 mr-1">#</span>
                <span x-text="ch.name.replace(/^#\s*/, '')" class="flex-1"></span>
                <span x-show="unread[ch.id]"
                      x-text="unread[ch.id]"
                      class="text-xs bg-sky-500 text-white rounded-full px-1.5 min-w-[1.25rem] text-center"></span>
              </button>
            </li>
          </template>
        </ul>

        <!-- Agents section -->
        <div class="px-3 py-1 mt-4 text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center">
          Agents
        </div>
        <ul class="space-y-0.5">
          <template x-for="a in agents" :key="a.name">
            <li>
              <button
                @click="selectAgent(a)"
                :class="activeAgent?.name === a.name
                  ? 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30'
                  : 'text-slate-300 hover:bg-surface-700 border-transparent'"
                class="w-full text-left px-3 py-1.5 rounded-md text-sm flex items-center border"
              >
                <span
                  class="w-5 h-5 rounded-full mr-2 flex items-center justify-center text-xs font-bold text-white"
                  :style="`background: ${avatarColor(a.npub)}`"
                  x-text="a.name.slice(0, 2).toUpperCase()"
                ></span>
                <span x-text="a.name" class="flex-1"></span>
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              </button>
            </li>
          </template>
        </ul>
      </nav>

      <!-- Identity footer w/ login picker -->
      <div class="border-t border-surface-700 bg-surface-900" x-data="{ menuOpen: false }">
        <div class="h-12 px-3 flex items-center">
          <div
            class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white"
            :style="`background: ${avatarColor(myNpub)}`"
            x-text="(myName || '?').slice(0, 2).toUpperCase()"
          ></div>
          <div class="ml-2 flex-1 min-w-0">
            <div class="text-sm font-medium truncate" x-text="myName || 'anonymous'"></div>
            <div class="text-xs text-slate-500 font-mono truncate" x-text="myNpub ? myNpub.slice(0, 14) + '…' : ''"></div>
          </div>
          <button
            @click="menuOpen = !menuOpen"
            class="text-xs text-slate-500 hover:text-slate-300 px-2 py-1 rounded"
            title="switch identity"
          >⇅</button>
        </div>
        <div x-show="menuOpen" @click.outside="menuOpen = false" class="border-t border-surface-700 px-3 py-2 space-y-1">
          <div class="text-xs text-slate-500 uppercase tracking-wider pb-1">Sign in as</div>
          <template x-for="id in identities" :key="id.name">
            <button
              @click="login(id.name); menuOpen = false"
              :class="myName === id.name ? 'bg-sky-500/15 text-sky-300' : 'hover:bg-surface-700 text-slate-300'"
              class="w-full text-left px-2 py-1.5 rounded text-sm flex items-center gap-2"
            >
              <span
                class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold text-white"
                :style="`background: ${avatarColor(id.npub)}`"
                x-text="id.name.slice(0, 2).toUpperCase()"
              ></span>
              <span class="flex-1" x-text="id.name"></span>
              <span x-show="myName === id.name" class="text-xs text-sky-400">✓</span>
            </button>
          </template>
          <button
            x-show="myName"
            @click="logout(); menuOpen = false"
            class="w-full text-left px-2 py-1.5 rounded text-sm text-rose-400 hover:bg-surface-700 mt-1 border-t border-surface-700 pt-2"
          >Sign out</button>
        </div>
      </div>
    </aside>

    <!-- ─────────────────────────── MAIN ─────────────────────────── -->
    <main class="flex-1 min-h-0 flex flex-col bg-surface-900 min-w-0 overflow-hidden">

      <!-- Channel header -->
      <header class="h-14 flex-none px-5 border-b border-surface-700 flex items-center bg-surface-800/60 backdrop-blur">
        <template x-if="activeChannel">
          <div class="flex items-center min-w-0">
            <span class="text-slate-500 mr-1">#</span>
            <h1 class="font-semibold truncate" x-text="activeChannel.name.replace(/^#\s*/, '')"></h1>
            <span class="ml-3 text-xs text-slate-500 font-mono" x-text="activeChannel.id"></span>
          </div>
        </template>
        <template x-if="!activeChannel && activeAgent && activeAgent.name">
          <div class="flex items-center min-w-0">
            <span
              class="w-7 h-7 rounded-full mr-2 flex items-center justify-center text-xs font-bold text-white"
              :style="`background: ${avatarColor(activeAgent.npub)}`"
              x-text="activeAgent.name.slice(0, 2).toUpperCase()"
            ></span>
            <h1 class="font-semibold truncate" x-text="activeAgent.name"></h1>
            <span class="ml-3 text-xs text-slate-500 font-mono truncate" x-text="activeAgent.npub"></span>
          </div>
        </template>
        <template x-if="!activeChannel && (!activeAgent || !activeAgent.name)">
          <div class="text-slate-500 text-sm">Select a channel or agent to begin</div>
        </template>

        <!-- Channel header -->
          <span x-show="streamConnected" class="text-xs text-emerald-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            live
          </span>
          <span x-show="!streamConnected && activeChannel" class="text-xs text-amber-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
            reconnecting…
          </span>

          <!-- Memories drawer toggle (right-aligned) -->
          <button
            @click="toggleMemories()"
            :class="memoriesOpen ? 'text-sky-400' : 'text-slate-400 hover:text-slate-200'"
            class="ml-auto flex items-center gap-1 text-xs px-3 py-1.5 rounded border border-surface-700 hover:border-surface-600"
            title="Toggle memories drawer"
          >
            <span>🧠</span>
            <span>Memories</span>
            <span
              x-show="memories.agents && memories.agents.length > 0"
              class="text-xs px-1.5 rounded bg-surface-700 text-slate-300"
              x-text="memories.agents.length"
            ></span>
          </button>
          <a
            href="/settings"
            class="ml-2 text-xs text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded border border-surface-700 hover:border-surface-600"
            title="Settings"
          >⚙</a>
      </header>

      <!-- Message stream -->
      <section class="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-3" x-ref="stream"
        @scroll="onStreamScroll($event)"
      >
        <template x-if="!activeChannel && (!activeAgent || !activeAgent.name)">
          <div class="h-full flex items-center justify-center text-slate-500">
            <div class="text-center max-w-md">
              <div class="text-4xl mb-3">⚡</div>
              <h2 class="text-lg font-semibold mb-1 text-slate-300">agentchat v1.2 — Nostr-native workspace</h2>
              <p class="text-sm">Pick a channel on the left to start reading messages, or post one from the box below.</p>
            </div>
          </div>
        </template>

        <template x-for="msg in messages" :key="msg.event_id">
          <article
            class="flex gap-3 px-3 py-2 rounded-md hover:bg-surface-800/50 transition-colors group"
          >
            <div
              class="w-9 h-9 rounded-md flex-shrink-0 flex items-center justify-center text-sm font-bold text-white"
              :style="`background: ${avatarColor(msg.pubkey)}`"
              x-text="aliasFor(msg.pubkey).slice(0, 2).toUpperCase()"
            ></div>
            <div class="flex-1 min-w-0">
              <header class="flex items-baseline gap-2 mb-0.5">
                <span class="font-semibold text-slate-200" x-text="aliasFor(msg.pubkey)"></span>
                <span class="text-xs text-slate-500 font-mono" x-text="shortKey(msg.pubkey)"></span>
                <time class="text-xs text-slate-500 ml-auto" x-text="formatTime(msg.created_at)" :datetime="new Date(msg.created_at * 1000).toISOString()"></time>
              </header>
              <div
                class="text-sm text-slate-200 whitespace-pre-wrap break-words"
                x-html="formatContent(msg.content)"
              ></div>
            </div>
          </article>
        </template>

        <div x-show="activeChannel && messages.length === 0" class="text-center text-slate-500 py-8 text-sm">
          No messages yet — be the first to post below.
        </div>
      </section>

      <!-- Post box -->
      <footer class="flex-none border-t border-surface-700 px-5 py-3 bg-surface-800/40">
        <template x-if="activeChannel">
          <form @submit.prevent="postMessage()" class="flex gap-2 items-start">
            <div class="flex-1 relative">
              <textarea
                x-model="draft"
                @keydown.enter.exact.prevent="postMessage()"
                @input="updateMentionSuggestions($event)"
                placeholder="Type a message — Enter to send, Shift+Enter for newline. Use @agent-name to mention."
                rows="1"
                class="w-full bg-surface-700 border border-surface-600 rounded-md px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500/50 resize-none max-h-32"
              ></textarea>

              <!-- Mention autocomplete dropdown -->
              <div
                x-show="mentionSuggestions.length > 0 && mentionOpen"
                class="absolute bottom-full mb-1 left-0 w-64 bg-surface-700 border border-surface-600 rounded-md shadow-lg overflow-hidden z-10"
              >
                <template x-for="(s, idx) in mentionSuggestions" :key="s.npub">
                  <button
                    type="button"
                    @click="applyMention(s)"
                    :class="idx === mentionSelected ? 'bg-sky-500/20' : 'hover:bg-surface-600'"
                    class="w-full text-left px-3 py-1.5 flex items-center gap-2 text-sm"
                  >
                    <span
                      class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold text-white"
                      :style="`background: ${avatarColor(s.npub)}`"
                      x-text="s.name.slice(0, 2).toUpperCase()"
                    ></span>
                    <span x-text="s.name"></span>
                    <span class="text-xs text-slate-500 font-mono ml-auto" x-text="s.npub.slice(0, 8) + '…'"></span>
                  </button>
                </template>
              </div>
            </div>
            <button
              type="submit"
              :disabled="!draft.trim() || posting"
              class="px-4 py-2 bg-sky-500 hover:bg-sky-400 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-md text-sm font-medium transition-colors flex items-center gap-1.5"
            >
              <span x-show="!posting">Send</span>
              <span x-show="posting">…</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
          </form>
        </template>
        <template x-if="!activeChannel">
          <div class="text-sm text-slate-500 text-center py-2">
            <template x-if="activeAgent">
              <span>Agent detail view (Slice 2) — for now, post to a channel to talk to <span x-text="activeAgent.name"></span>.</span>
            </template>
            <template x-if="!activeAgent">
              Select a channel to start posting.
            </template>
          </div>
        </template>
      </footer>
    </main>

    <!-- ─────────────────────────── MEMORIES DRAWER (right) ─────────────── -->
    <aside
      x-show="memoriesOpen"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full"
      class="w-96 bg-surface-800 border-l border-surface-700 flex-none flex flex-col overflow-hidden"
      @keydown.escape.window="memoriesOpen = false"
    >
      <!-- Drawer header -->
      <header class="h-14 px-5 border-b border-surface-700 flex items-center bg-surface-800/60 backdrop-blur flex-none">
        <div class="flex-1">
          <h2 class="text-sm font-semibold flex items-center gap-2">
            <span>🧠</span>
            <span>Memories</span>
            <span class="text-xs text-slate-500 font-mono" x-text="`${(memories.agents || []).length} agent${(memories.agents || []).length === 1 ? '' : 's'}`"></span>
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">What each agent knows. Click any line to edit.</p>
        </div>
        <button @click="loadMemories()" :disabled="memories.loading" class="text-xs text-slate-400 hover:text-slate-200 px-2 py-1 rounded" title="Refresh">↻</button>
        <button @click="memoriesOpen = false" class="text-slate-500 hover:text-slate-200 px-2 py-1 rounded" title="Close (esc)">×</button>
      </header>

      <!-- Drawer body -->
      <section class="flex-1 min-h-0 overflow-y-auto px-4 py-4 space-y-4">
        <!-- Loading state -->
        <template x-if="memories.loading && (!memories.agents || memories.agents.length === 0)">
          <div class="text-center text-slate-500 text-sm py-8">Loading memories…</div>
        </template>

        <!-- Empty state -->
        <template x-if="!memories.loading && (!memories.agents || memories.agents.length === 0)">
          <div class="text-center text-slate-500 text-sm py-8">
            No agent memories yet.<br>
            <span class="text-xs">Post a message to #general — agents will start remembering things.</span>
          </div>
        </template>

        <!-- One card per agent -->
        <template x-for="agent in (memories.agents || [])" :key="agent.name">
          <article class="bg-surface-900 rounded-lg p-3 border border-surface-700">
            <header class="flex items-center gap-2 mb-2">
              <span
                class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white flex-none"
                :style="`background: ${avatarColor(agent.name)}`"
                x-text="agent.name.slice(0, 2).toUpperCase()"
              ></span>
              <div class="min-w-0 flex-1">
                <div class="text-sm font-semibold truncate" x-text="agent.name"></div>
                <div class="text-xs text-slate-500" x-text="`${agent.sections.filter(s => s.title).length} section${agent.sections.filter(s => s.title).length === 1 ? '' : 's'}`"></div>
              </div>
            </header>

            <!-- Sections -->
            <template x-for="section in agent.sections" :key="`${agent.name}-${section.index}`">
              <div class="mt-2 first:mt-0">
                <h4
                  class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1 cursor-pointer select-none"
                  @click="toggleSection(agent.name, section.title)"
                >
                  <span x-text="memories.collapsed[`${agent.name}-${section.title}`] ? '▸' : '▾'" class="text-slate-500 w-3 inline-block"></span>
                  <span x-text="section.title || '(intro)'" class="flex-1 truncate"></span>
                  <button
                    x-show="section.title"
                    @click.stop="addLinePrompt(agent.name, section.title)"
                    class="text-slate-500 hover:text-sky-400 text-xs px-1"
                    title="Add line"
                  >+</button>
                </h4>

                <div x-show="!memories.collapsed[`${agent.name}-${section.title}`]" class="mt-1 space-y-1">
                  <template x-if="!section.lines || section.lines.length === 0">
                    <div class="text-xs text-slate-600 italic px-2 py-1">(empty)</div>
                  </template>

                  <template x-for="(line, lineIdx) in section.lines" :key="`${agent.name}-${section.index}-${lineIdx}`">
                    <div class="flex items-start gap-1 group">
                      <span class="text-slate-600 text-xs leading-5 mt-0.5">•</span>
                      <!-- Read mode -->
                      <span
                        x-show="!memories.editing[`${agent.name}-${section.title}-${lineIdx}`]"
                        @click="startEdit(agent.name, section.title, lineIdx, line)"
                        class="flex-1 text-xs text-slate-200 leading-5 break-words cursor-text hover:bg-surface-800 -mx-1 px-1 rounded"
                        x-text="line"
                      ></span>
                      <!-- Edit mode -->
                      <input
                        x-show="memories.editing[`${agent.name}-${section.title}-${lineIdx}`]"
                        @keydown.enter.prevent="commitEdit(agent.name, section.title, lineIdx)"
                        @keydown.escape.prevent="cancelEdit()"
                        x-model="memories.draft"
                        x-init="$nextTick(() => $el && $el.focus())"
                        class="flex-1 text-xs bg-surface-800 border border-sky-500 rounded px-1 py-0.5 text-slate-100 focus:outline-none"
                      />
                      <button
                        x-show="!memories.editing[`${agent.name}-${section.title}-${lineIdx}`] && section.title"
                        @click="removeLine(agent.name, section.title, lineIdx)"
                        class="opacity-0 group-hover:opacity-100 text-rose-400 hover:text-rose-300 text-xs px-1 leading-5"
                        title="Remove"
                      >×</button>
                    </div>
                  </template>

                  <!-- Add line input (collapsed by default) -->
                  <template x-if="memories.addingLineFor === `${agent.name}::${section.title}`">
                    <div class="flex gap-1 mt-1">
                      <input
                        x-model="memories.draft"
                        @keydown.enter.prevent="commitAddLine(agent.name, section.title)"
                        @keydown.escape.prevent="memories.addingLineFor = null"
                        placeholder="New line…"
                        x-init="$nextTick(() => $el && $el.focus())"
                        class="flex-1 text-xs bg-surface-800 border border-emerald-500 rounded px-1.5 py-1 text-slate-100 focus:outline-none"
                      />
                      <button @click="commitAddLine(agent.name, section.title)" class="text-emerald-400 hover:text-emerald-300 text-xs px-1.5" title="Add">✓</button>
                      <button @click="memories.addingLineFor = null" class="text-slate-500 hover:text-slate-300 text-xs px-1.5" title="Cancel">×</button>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Add section input -->
            <template x-if="memories.addingSectionFor === agent.name">
              <div class="flex gap-1 mt-3">
                <input
                  x-model="memories.draft"
                  @keydown.enter.prevent="commitAddSection(agent.name)"
                  @keydown.escape.prevent="memories.addingSectionFor = null"
                  placeholder="New section name…"
                  class="flex-1 text-xs bg-surface-800 border border-sky-500 rounded px-2 py-1 text-slate-100 focus:outline-none"
                />
                <button @click="commitAddSection(agent.name)" class="text-emerald-400 hover:text-emerald-300 text-xs px-2" title="Create">✓</button>
                <button @click="memories.addingSectionFor = null" class="text-slate-500 hover:text-slate-300 text-xs px-2">×</button>
              </div>
            </template>
            <button
              x-show="memories.addingSectionFor !== agent.name"
              @click="memories.addingSectionFor = agent.name; memories.draft = ''"
              class="mt-2 text-xs text-slate-500 hover:text-sky-400"
            >+ add section</button>
          </article>
        </template>

        <!-- Toast feedback -->
        <div
          x-show="memories.toast"
          x-transition
          class="fixed bottom-4 right-4 bg-slate-900 border border-slate-700 text-slate-100 px-4 py-2 rounded shadow-lg text-sm"
          :class="memories.toast?.kind === 'error' ? 'border-rose-500' : 'border-emerald-500'"
          x-text="memories.toast?.text"
        ></div>
      </section>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
